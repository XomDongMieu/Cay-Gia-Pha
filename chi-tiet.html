const D=[["1", "Nguyễn Trang · Đức Thỉ Tổ", "<p class=in><b>Đời thứ nhất - Đức Thỉ Tổ<\/b> được ghi chép trong gia phả của dòng họ:<\/p><h3>1. Danh tính &amp; Xuất thân<\/h3><ul><li><b>Họ tên:<\/b> Ngài mang <b>họ Nguyễn, tên huý là Trang<\/b>.<\/li><li><b>Quê quán:<\/b> Gia tiên của ngài gốc ở <b>làng Hoa Phong, huyện Lệ Dương, lộ Thanh Hóa<\/b>.<\/li><\/ul><h3>2. Quá trình lập nghiệp &amp; Địa danh qua các thời kỳ<\/h3><ul><li>Khi nhà Lê đánh chiếm Thành và lấy đất đặt làm lộ Quảng Nam vệ Thăng Hoa, ngài được cử cai quản một vùng đất.<\/li><li>Sau khi phân chia địa giới hành chính, nơi ngài cai quản thuộc <b>lộ Quảng Nam, vệ Thăng Hoa, huyện Lệ Dương, xã Hoa Phong, thôn Nhị Giáp<\/b>.<\/li><li>Địa danh này trải qua nhiều thay đổi lịch sử: thời Đoan Quốc công đổi làm xứ Quảng Nam phủ Thăng Hoa; đến thời vua Thái Đức đổi thành trấn Quảng Nam, phủ Điện Bàn, huyện Diên Khánh, tổng Hạ Nông, xã Hoa Phong, thôn Nhị Giáp; sau đổi Hoa Phong thành Khả Phong, và về sau đổi thành <b>xã Phong Nhị<\/b>.<\/li><\/ul><h3>3. Hôn nhân &amp; Hậu duệ<\/h3><ul><li>Ngài phối cùng <b>bà Thị Đài<\/b>, hạ sinh con cháu đông đúc và ngày càng thịnh vượng.<\/li><li>Do sách phả cũ bị rách nát, lai lịch, mồ mả cũng như ngày kỵ (ngày giỗ) của bà Thị Đài không còn ghi chép rõ để cứu xét.<\/li><\/ul><h3>4. Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Nơi an táng:<\/b> Ngài mất và được an táng tại <b>chốn xứ Dương Thần<\/b>, tọa <b>khảm long tỵ hướng<\/b>, có <b>bia chí và lầu bia 3 tầng<\/b>.<\/li><li><b>Ngày kỵ nhật:<\/b> Ngày giỗ hàng năm của ngài là <b>ngày 22 tháng 2 (âm lịch)<\/b>.<\/li><\/ul><h3>5. Công đức đối với dòng họ<\/h3><ul><li>Gia phả ghi nhận ngài là bậc mở cội nguồn bền vững, tạo dựng gốc rễ sâu dày để các cành nhánh tộc Nguyễn phát triển rậm rạp và thịnh vượng về sau.<\/li><\/ul>"], ["2", "Nhị thế tổ", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ hai - Nhị thế tổ<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Xuất thân &amp; Chức vị<\/h3><ul><li><b>Thân thế:<\/b> Ngài là con trai của Đức Thỉ Tổ (Nguyễn Trang).<\/li><li><b>Chức vị:<\/b> Ngài từng giữ chức <b>Sanh đề ở bản phủ<\/b>.<\/li><\/ul><h3>2. Hậu duệ &amp; Sự khởi đầu của hai Phái dòng họ<\/h3><ul><li>Ngài hạ sinh được <b>2 người con trai<\/b>:<\/li><ul><li>Con trưởng: <b>Đức Quang<\/b> — ngài là Tổ của <b>Phái Nhất<\/b> (tộc phái thứ nhất).<\/li><li>Con thứ: <b>Đức Thuần<\/b> — ngài là Tổ của <b>Phái Nhì<\/b> (tộc phái thứ hai).<\/li><\/ul><li>Khi con cháu về sau ngày càng đông đúc, dòng họ chính thức phân chia ra làm 2 phái chính; cả phái Nhất và phái Nhì đều lập tôn đồ phả hệ riêng để lưu truyền cho hậu thế.<\/li><\/ul><h3>3. Mộ phần &amp; Lai lịch<\/h3><ul><li><b>Nơi an táng:<\/b> Ngài mất và được an táng tại <b>chốn xứ Dương Thần<\/b>, tọa <b>long tỵ hướng khảm<\/b>.<\/li><li><b>Bia mộ:<\/b> Mộ phần của ngài được xây dựng có <b>bia chí và lầu bia 2 tầng<\/b>.<\/li><li><b>Thông tin về Chính thất (Bà):<\/b> Tên, ngày mất, ngày giỗ cũng như lai lịch mồ mả của bà đều không còn ghi chép rõ do văn bản phả hệ cũ qua thời gian bị rách nát.<\/li><\/ul>"], ["3.1", "Đức Quang · Tổ Phái Nhất", "<p class=in>Đời thứ ba (<b>Tam thế tổ<\/b>) trong gia phả được chia thành 2 vị Tổ đại diện cho hai nhánh <b>Phái Nhất<\/b> và <b>Phái Nhì<\/b>:<\/p><h3>1. Đức Quang (Con trưởng — Tổ Phái Nhất)<\/h3><ul><li><b>Thân thế:<\/b> Ngài là con trai lớn (con trưởng) của Đức Nhị thế tổ.<\/li><li><b>Chức vị:<\/b> Ngài cùng viện lễ giữ chức <b>Sanh đề ở bản phủ<\/b>.<\/li><li><b>Hậu duệ:<\/b> Ngài sinh được một người con trai là <b>Đức Thọ<\/b>. Việc gìn giữ gia đạo nhân hậu giúp dòng họ Nguyễn nối đời truyền qua các thế hệ và ngày càng thêm thịnh vượng.<\/li><li><b>Mộ phần:<\/b> Ngài mất và được an táng tại <b>Dương Tháp<\/b>, tọa <b>khảm hướng ly<\/b>.<\/li><li><b>Lai lịch chưa rõ:<\/b> Ngày kỵ nhật (ngày giỗ) của ngài cũng như thông tin lai lịch về bà chính thất không còn cứu xét được do tư liệu phả hệ cũ bị mục rách.<\/li><\/ul>"], ["3.2", "Đức Thuần · Tổ Phái Nhì", "<p class=in>Đời thứ ba (<b>Tam thế tổ<\/b>) trong gia phả được chia thành 2 vị Tổ đại diện cho hai nhánh <b>Phái Nhất<\/b> và <b>Phái Nhì<\/b>:<\/p><h3>2. Đức Thuần (Con thứ — Tổ Phái Nhì)<\/h3><ul><li><b>Thân thế:<\/b> Ngài là con trai thứ của Đức Nhị thế tổ, là em ruột của ông Đức Quang.<\/li><li><b>Chức vị:<\/b> Ngài giữ chức <b>Ký phủ Thuần Khương tử<\/b>.<\/li><li><b>Hậu duệ:<\/b> Ngài hạ sinh và mở đầu cho nhánh <b>Phái Nhì<\/b>, con cháu về sau sinh sôi phát triển rất đông đúc.<\/li><li><b>Mộ phần:<\/b> Ngài mất và được an táng tại xứ <b>Dương Thần<\/b>, tọa <b>ly hướng khảm<\/b>.<\/li><li><b>Lai lịch chưa rõ:<\/b> Ngày kỵ nhật của ngài và lai lịch mồ mả của bà cũng không còn ghi chép rõ do văn bản phả cũ bị hư hại theo thời gian.<\/li><\/ul>"], ["4", "Đức Thọ", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ tư - Tứ thế tổ (Đức Thọ)<\/b> thuộc nhánh Phái Nhất trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Thọ<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai của Tam thế tổ <b>Đức Quang<\/b> (nhánh Phái Nhất).<\/li><\/ul><h3>2. Đức hạnh &amp; Lối sống<\/h3><ul><li>Ngài là bậc gia trưởng chỉn chu, hết lòng thờ phụng ông bà, ân cần dạy bảo con cháu và thu xếp công việc gia đình êm đẹp.<\/li><li>Ngài sống luôn giữ đạo lý thuận hòa với xóm giềng, được bà con xa gần xung quanh vô cùng mến kính.<\/li><\/ul><h3>3. Hậu duệ<\/h3><p class=in>Ngài hạ sinh được <b>2 người con trai<\/b>:<\/p><ul><li>Con trưởng: <b>Đức Thắng<\/b> — người kế thừa nối dòng phả hệ cho tộc Nguyễn.<\/li><li>Con thứ: <b>Đức Tuệ<\/b> — mất từ lúc còn sớm.<\/li><\/ul><h3>4. Mộ phần &amp; Lai lịch<\/h3><ul><li>Ngày kỵ nhật (ngày giỗ) và mồ mả của ngài, cũng như thông tin lai lịch mồ mả của bà chính thất đều bị hư hại, rách nát trong tư liệu phả hệ cũ nên không còn ghi chép rõ để cứu xét.<\/li><\/ul>"], ["5", "Đức Thắng", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 5 - Ngũ thế tổ (Đức Thắng)<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Thắng<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai của Tứ thế tổ <b>Đức Thọ<\/b>.<\/li><\/ul><h3>2. Đức hạnh &amp; Lối sống<\/h3><ul><li>Ngài là người nối nếp nhà, chăm lo làm ruộng, hết lòng dạy dỗ con cái và hiếu phụng ông bà.<\/li><li>Sự thấu hiểu đạo lý và cách sống của ngài được cả dòng họ lẫn xóm làng hết lời ngợi khen, tạo dựng phúc đức sâu dày cho con cháu các đời sau ghi nhớ.<\/li><\/ul><h3>3. Hậu duệ<\/h3><p class=in>Ngài hạ sinh được <b>2 người con trai<\/b>:<\/p><ul><li>Con trưởng: <b>Đức Mạnh<\/b> (Lục thế tổ đời 6.1).<\/li><li>Con thứ: <b>Đức Võ<\/b> (Lục thế tổ đời 6.2).<\/li><\/ul><h3>4. Mồ mả &amp; Lai lịch<\/h3><ul><li>Thông tin về mồ mả, ngày kỵ nhật (ngày giỗ) của ngài cũng như lai lịch của bà chính thất đều <b>không còn rõ<\/b> trong tư liệu gia phả.<\/li><\/ul>"], ["6.1", "Đức Mạnh", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 6 - Lục thế tổ (Đức Mạnh)<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Mạnh<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai lớn (con trưởng) của Ngũ thế tổ <b>Đức Thắng<\/b>.<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><ul><li><b>Chính thất:<\/b> Ngài phối cùng bà <b>Thị Bi<\/b>, là con gái của ông Nguyễn Vĩnh Tân người trong làng.<\/li><li><b>Hậu duệ:<\/b> Ngài và bà sinh hạ được <b>1 người con trai<\/b> và <b>3 người con gái<\/b>:<\/li><ul><li>Con trai: <b>Đức Cường<\/b> (kế thừa phả hệ Đời thứ 7).<\/li><li>Con gái lớn: <b>Thị Hiện<\/b> (có chồng).<\/li><li>Con gái thứ hai: <b>Thị Hổ<\/b> (gả cho ông Huỳnh Công Kiện ở Giáp Ba).<\/li><li>Con gái út: <b>Thị Chi<\/b> (gả cho ông Huấn đạo kính luận Nam Trịnh Công Thị ở trong làng).<\/li><\/ul><\/ul><h3>3. Phẩm hạnh &amp; Lối sống<\/h3><ul><li>Ngài có tính tình <b>hiền lành, hậu thiệt<\/b>, luôn giữ gìn nếp sống lễ lối gia phong, được bà con hàng xóm xung quanh hết lòng mến phục.<\/li><\/ul><h3>4. Hưởng thọ, Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Đối với ngài Đức Mạnh:<\/b><\/li><ul><li>Ngài hưởng thọ <b>63 tuổi<\/b>.<\/li><li>Mất ngày <b>11 tháng 8 (âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>chốn xứ Dương Thần<\/b> (thứ 3 đoạn nhì), tọa <b>tốn hướng cấn<\/b>.<\/li><\/ul><li><b>Đối với bà Thị Bi:<\/b><\/li><ul><li>Bà mất ngày <b>6 tháng 11 (âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>xứ Đồn Điền<\/b>, tọa <b>khôn hướng cấn<\/b>.<\/li><\/ul><\/ul>"], ["6.2", "Đức Võ", "<p class=in>Dưới đây là chi tiết về <b>Đời thứ 6 - Lục thế tổ (Đức Võ - Đời 6.2)<\/b> được ghi chép đầy đủ và xúc động trong phả hệ dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Võ<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai thứ của Ngũ thế tổ <b>Đức Thắng<\/b> (em trai của Lục thế tổ Đức Mạnh).<\/li><li><b>Thời trẻ:<\/b> Ngài là bậc nam nhi tuổi xanh tràn đầy hào khí.<\/li><\/ul><h3>2. Sự nghiệp &amp; Chức vị<\/h3><ul><li>Ngài ra thành <b>Phú Xuân<\/b>, vào ra mắt ông <b>Tổng quốc chánh đại nguyên súy Tổ quốc công<\/b> và được bổ nhiệm giữ chức <b>Thuộc viện<\/b>.<\/li><\/ul><h3>3. Sự tích hy sinh vì nhiệm vụ<\/h3><ul><li>Nhân dịp <b>tiết Trung thu<\/b>, Quốc công đi thuyền tuần từ Từ Dụng để nghênh tiếp thuyền đoàn.<\/li><li>Giữa dòng, không may gặp trận gió to dữ dội khiến quân lính cầm tàn (lọng) không đứng vững nổi. Trong tình thế nguy cấp, ngài Đức Võ đã dốc sức cầm giữ thân tàn hết sức vững vàng.<\/li><li>Cuồng phong giằng co dữ dội, ngài cùng chiếc tàn bị gió lớn cuốn bay mất tích trên sông.<\/li><li>Khi dông bão lặng, Quốc công chứng kiến sự việc đã bàng hoàng, hết lời than thở và vô cùng thương tiếc ngài.<\/li><\/ul><h3>4. Truy tặng, Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Truy tặng tước vị:<\/b> Khi trở về thành Phú Xuân, Quốc công đã làm lễ truy tặng ngài tước <b>Võ Liệt Bá<\/b>.<\/li><li><b>Chiêu hồn &amp; Mộ phần:<\/b> Quốc công cho đưa tin về làng để làm lễ chiêu hồn ngài. Mồ (mộ chiêu hồn) được đắp tại <b>xứ Dương Thần<\/b>, tọa <b>đoài hướng cấn<\/b>.<\/li><li><b>Ngày kỵ nhật:<\/b> Ngày giỗ hàng năm của ngài được tổ chức vào ngày <b>mồng 10 tháng 8 (âm lịch)<\/b>.<\/li><\/ul>"], ["7", "Đức Cường", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 7 - Thất thế tổ (Đức Cường)<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Cường<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai lớn (con trưởng) của Lục thế tổ <b>Đức Mạnh<\/b>.<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><ul><li><b>Chính thất:<\/b> Ngài phối cùng bà <b>Thị Đoán<\/b>, là con gái của ông Phan Công Xái người trong làng.<\/li><li><b>Con trai (2 người):<\/b><\/li><ul><li>Con trưởng: <b>Đức Hoạch<\/b> (tổ chi 1 Bát thế tổ).<\/li><li>Con thứ: <b>Đức Do<\/b> (tổ chi 2 Bát thế tổ).<\/li><\/ul><li><b>Con gái (4 người):<\/b><\/li><ul><li><b>Thị Dòng:<\/b> Gả cho Đội trưởng Huy Quan Hầu ở Cẩm Nê.<\/li><li><b>Thị Kỳ:<\/b> Gả cho Huỳnh Công Tây ở Giáp Ba.<\/li><li><b>Thị Nhung:<\/b> Gả cho Phan Văn Loan ở trong làng.<\/li><li><b>Thị Tuy:<\/b> Gả cho Phan Công Phấn ở trong làng.<\/li><\/ul><\/ul><h3>3. Đạo hạnh, Thọ kỷ, Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Đối với ngài Đức Cường:<\/b><\/li><ul><li>Ngài thường thờ Phật, được quy y với pháp danh là <b>Tiến Nhân<\/b>.<\/li><li>Hưởng thọ <b>67 tuổi<\/b>.<\/li><li>Mất ngày <b>25 tháng 8 (âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>chốn xứ Dương Thần<\/b> (thứ 5 đoạn 1), tọa <b>khảm long ly hướng<\/b>.<\/li><\/ul><li><b>Đối với bà Thị Đoán:<\/b><\/li><ul><li>Bà có pháp danh là <b>Tiến Thuận<\/b>.<\/li><li>Hưởng thọ <b>65 tuổi<\/b>.<\/li><li>Mất ngày <b>16 tháng 5 (âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>chốn xứ Đồn Điền Quảng Lăng<\/b> (trạc tư thổ), tọa <b>khôn hướng cấn<\/b>.<\/li><\/ul><\/ul><h3>4. Lịch sử phân chia Chi dòng họ<\/h3><ul><li>Đến các đời sau, con cháu ngày càng sinh sôi đông đúc, hai người con trai của ngài là <b>ông Hoạch<\/b> và <b>ông Do<\/b> chính thức phân chia dòng họ thành <b>2 chi<\/b> riêng biệt và đều lập biệt lục đồ phổ để lưu truyền.<\/li><\/ul>"], ["8", "Đức Hoạch", "<p class=in>Thông tin chi tiết về <b>Đời thứ 8 - Bát thế tổ (Đức Hoạch)<\/b> thuộc nhánh Phái Nhất trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Hoạch<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai lớn (con trưởng) của Thất thế tổ <b>Đức Cường<\/b>.<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><ul><li><b>Chính thất:<\/b> Ngài phối cùng bà <b>Thị Diệu<\/b>, con gái của ông Phan Văn Tiến người trong làng. Bà là người có nết <b>đoan trang trinh thục<\/b>, gia đạo xướng tùy thuận hòa, được bà con gần xa rất mực kính mến.<\/li><ul><li><b>Con trai (2 người):<\/b><\/li><ul><li><b>Đức Từ<\/b> (tổ chi 1 Cửu thế tổ).<\/li><li><b>Đức Hạc<\/b> (tổ chi 2 Cửu thế tổ).<\/li><\/ul><li><b>Con gái (4 người):<\/b><\/li><ul><li><b>Thị Thi Huyện:<\/b> Gả cho Lê Văn Ngự ở Quảng Hầu.<\/li><li><b>Thị Tránh:<\/b> Gả cho ông chỉ huy sứ Hòa Đức Nam Lê Văn Thục ở trong làng.<\/li><li><b>Thị Nguyệt:<\/b> Gả cho Nguyễn Thấn Tài ở Phong Hồ.<\/li><li><b>Thị Lãng:<\/b> Gả cho Trịnh Công Chánh ở trong làng.<\/li><\/ul><\/ul><li><b>Hậu phối (Vợ thứ):<\/b> Sau này ngài cưới thêm bà <b>Lê Thị Dị<\/b> ở trong làng làm hậu phối, sinh hạ được 1 người con trai là <b>Đức Phường<\/b> (nhưng mất sớm).<\/li><\/ul><h3>3. Đức hạnh &amp; Bối cảnh thời cuộc<\/h3><ul><li><b>Tính cách:<\/b> Ngài có tính tình <b>hiếu hữu, từ tường<\/b>.<\/li><li><b>Bối cảnh lịch sử:<\/b> Ngài sống vào niên hiệu <b>Cảnh Hưng (nhà Lê)<\/b>. Thời điểm này Chúa Nguyễn Phúc Thuần nhỏ tuổi nối ngôi, quyền thần Trương Phúc Luân thao túng khiến đất nước loạn lạc; cùng lúc phong trào Tây Sơn của vua Thái Đức khởi nghĩa lan rộng khiến vùng Quảng Nam rơi vào cảnh binh hỏa.<\/li><li><b>Cuộc sống:<\/b> Tuy gặp lúc thời gian nan, ngài không làm công việc gì nhiều, nhờ gia đình ăn ở phúc đức nên được bà con trong làng đều thương yêu giúp đỡ, giữ cho gia đạo vượt qua sóng gió bình an.<\/li><\/ul><h3>4. Đạo hạnh, Hưởng thọ, Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Đạo hạnh:<\/b> Ngài hết lòng sùng tín Phật pháp, có pháp danh là <b>Toàn Đặng<\/b>.<\/li><li><b>Hưởng thọ:<\/b> Ngài hưởng thọ <b>59 tuổi<\/b>.<\/li><li><b>Ngày kỵ nhật:<\/b> Ngài mất vào ngày <b>27 tháng 1 (âm lịch)<\/b>.<\/li><li><b>Mộ phần:<\/b> An táng tại <b>chốn xứ Dương Thần<\/b> (ba Đoan hai), tọa <b>khôn long cấn hướng<\/b>.<\/li><\/ul><h3>5. Sự phân chi đời sau<\/h3><ul><li>Về sau, con cháu của hai người con trai ngài là <b>Đức Từ<\/b> và <b>Đức Hạc<\/b> tiếp tục phân chia dòng họ thành <b>2 chi<\/b> riêng biệt và đều lập biệt lục đồ phổ lưu truyền cho hậu thế.<\/li><\/ul>"], ["9", "Đức Từ", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 9 - Cửu thế tổ (Đức Từ)<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên huý:<\/b> Ngài mang tên huý là <b>Đức Từ<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai lớn (con trưởng) của Bát thế tổ <b>Đức Hoạch<\/b>.<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><ul><li><b>Chính thất:<\/b> Ngài phối cùng bà <b>Thị Thuyên<\/b>, là con gái của ông bếp Khơm ở Ngũ Giáp.<\/li><li><b>Con trai (6 người):<\/b><\/li><ul><li><b>Đức Hoàn:<\/b> Mất từ lúc còn sớm.<\/li><li><b>Đức Chu<\/b>.<\/li><li><b>Đức Trưởng<\/b>.<\/li><li><b>Đức Thung:<\/b> Người kế thừa nối dòng phả hệ cho Đời thứ 10 (Thập thế tổ).<\/li><li><b>Đức Thông<\/b>.<\/li><li><b>Đức Đạt<\/b>.<\/li><\/ul><li><b>Con gái (3 người):<\/b><\/li><ul><li><b>Thị Tùng:<\/b> Gả cho Tổng trưởng Trịnh Công Mạc ở trong làng.<\/li><li><b>Thị Viện:<\/b> Mất từ lúc còn sớm.<\/li><li><b>Thị Thổ:<\/b> Gả cho ông Phó hương Nhuận trạch hầu Trịnh Công Yên ở trong làng.<\/li><\/ul><\/ul><h3>3. Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Nơi an táng:<\/b> Cả hai ông bà đều mất sớm và được an táng tại <b>xứ Thần Từ<\/b>.<\/li><li><b>Ngày kỵ nhật của ngài Đức Từ:<\/b> Ngày <b>17 tháng 4 (âm lịch)<\/b>.<\/li><li><b>Ngày kỵ nhật của bà Thị Thuyên:<\/b> Ngày <b>24 tháng 7 (âm lịch)<\/b>.<\/li><\/ul>"], ["10", "Đức Thung", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 10 - Thập thế tổ (Đức Thung)<\/b> được ghi chép trong gia phả dòng họ:<\/p><h3>1. Danh tính &amp; Thân thế<\/h3><ul><li><b>Tên tự:<\/b> Ngài mang tên tự là <b>Đức<\/b>.<\/li><li><b>Tên chữ:<\/b> Kính tên chữ là <b>Đức Thung<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai thứ tư của Cửu thế tổ <b>Đức Từ<\/b>.<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><p class=in>Ngài phối cùng hai bà là bà <b>Phan Thị<\/b> và bà <b>Trịnh Thị Thuận<\/b>. Ngài và các bà sinh hạ được <b>3 người con trai<\/b> và <b>3 người con gái<\/b>:<\/p><ul><li><b>Con trai (3 người):<\/b><\/li><ul><li><b>Đức Tuân:<\/b> Con trai lớn (Đời 11.1).<\/li><li><b>Đức Thục:<\/b> Con trai thứ hai (Đời 11.2).<\/li><li><b>Đức Mùi:<\/b> Con trai út (Đời 11.3).<\/li><\/ul><li><b>Con gái (3 người):<\/b><\/li><ul><li><b>Thị Bẹ:<\/b> Gả cho người ở trong làng.<\/li><li><b>Thị Quơi<\/b>.<\/li><li><b>Thị Thạc<\/b>.<\/li><\/ul><\/ul><h3>3. Phẩm hạnh &amp; Đạo đức<\/h3><ul><li>Ngài suốt một đời <b>trung hậu, nối gieo nghiệp nhà<\/b>, gầy dựng nếp gia phong bền vững và tích tạo phúc đức sâu dày cho con cháu đời sau được hưởng phước.<\/li><\/ul><h3>4. Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Đối với ngài Đức Thung:<\/b><\/li><ul><li>Ngài mất vào ngày <b>23 tháng Chạp (tháng 12 âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>chốn xứ Ngoại Trạch<\/b>.<\/li><\/ul><li><b>Đối với các vị Hiền phối:<\/b><\/li><ul><li><b>Bà Phan Thị:<\/b> Mất ngày <b>6 tháng 5 (âm lịch)<\/b>, mồ mả cũng được an táng tại <b>chốn xứ Ngoại Trạch<\/b>.<\/li><li><b>Bà Trịnh Thị Thuận:<\/b> Thông tin ngày mất và nơi an táng không còn rõ.<\/li><\/ul><\/ul>"], ["11.1", "Đức Tuân", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 11 (gồm 3 nhánh 11.1, 11.2, 11.3)<\/b> và vai trò kết nối lịch sử với <b>Đời thứ 12 \/b> Ngài mang tên uý là <b>Đức Lự<\/b>.<\/li><li><b>Thân thế:<\/b> Ngài là con trai của ông <b>Đức Mùi<\/b> (Đời thứ 11.3).<\/li><\/ul><h3>2. Hôn nhân &amp; Hậu duệ<\/h3><ul><li><b>Chính thất:<\/b> Ngài phối cùng bà <b>Lê Thị Thanh<\/b>, người làng Quảng Hậu.<\/li><li><b>Con trai (3 người):<\/b><\/li><ul><li><b>Đức Thỏa:<\/b> Trưởng thành (nối nghiệp phả hệ Đời 13.1).<\/li><li><b>Đức Đào:<\/b> Trưởng thành (nối nghiệp phả hệ Đời 13.2).<\/li><li><b>Đức Lý:<\/b> Trưởng thành (nối nghiệp phả hệ Đời 13.3).<\/li><\/ul><li><b>Con gái (6 người):<\/b><\/li><ul><li><b>Thị Tư:<\/b> Lấy chồng người xứ Ngân Giang.<\/li><li><b>Thị Lời:<\/b> Qua đời (mất).<\/li><li><b>Thị Đủ:<\/b> Không lấy chồng.<\/li><li><b>Thị Lý:<\/b> Mất từ lúc còn sớm.<\/li><li><b>Thị Biệt:<\/b> Mất từ lúc còn sớm.<\/li><li><b>Thị Mót:<\/b> Lấy chồng người làng Quảng Hậu, sau khi qua đời được an táng tại <b>xứ Tháp Như<\/b>.<\/li><\/ul><\/ul><h3>3. Mộ phần &amp; Ngày giỗ (Kỵ nhật)<\/h3><ul><li><b>Đối với ngài Đức Lự:<\/b><\/li><ul><li>Mất ngày <b>22 tháng 10 (âm lịch)<\/b>.<\/li><li>Mồ mả an táng tại <b>chốn Đồng Miếu<\/b>.<\/li><\/ul><li><b>Đối với bà Lê Thị Thanh:<\/b><\/li><ul><li>Mất ngày <b>22 tháng 8 (âm lịch)<\/b>.<\/li><li>Mồ mả cũng được an táng tại <b>chốn Đồng Miếu<\/b>.<\/li><\/ul><\/ul>"], ["13.1", "Đức Thỏa", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 13 (MƯỜI BA)<\/h3><p class=in>Ba người con trai trưởng thành của ngài <b>Đức Lự<\/b> (Đời thứ 12) chính là những người phát triển nhánh họ ở Đời thứ 13:<\/p><h3>1. Đức Thỏa (Đời 13.1 - Con trưởng)<\/h3><ul><li><b>Danh tính:<\/b> Ngài mang tên uý là <b>Đức Thỏa<\/b>, con trai trưởng của ông Đức Lự.<\/li><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Phạm Thị Nhỏ<\/b>, người ở La Qua.<\/li><li><b>Hậu duệ:<\/b><\/li><ul><li><b>Con gái:<\/b> <b>Thị Minh<\/b> (có chồng ở Phong Hồ), <b>Thị Đường<\/b> (có chồng ở La Qua), <b>Thị Tấn<\/b> (mất sớm).<\/li><li><b>Con trai:<\/b> <b>Đức Quỳ<\/b> (mất sớm), <b>Đức Sắc<\/b> và <b>Đức Đá<\/b> (đều trưởng thành).<\/li><\/ul><li><b>Mộ phần &amp; Kỵ nhật:<\/b><\/li><ul><li>Ngài Đức Thỏa mất ngày <b>22 tháng 10 (âm lịch)<\/b>, an táng tại <b>Gò Quảng<\/b>.<\/li><li>Bà Phạm Thị Nhỏ mất ngày <b>5 tháng 11 (âm lịch)<\/b>, an táng tại <b>Đồn Điền<\/b>.<\/li><\/ul><\/ul>"], ["13.2", "Đức Đào", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 13 (MƯỜI BA)<\/h3><p class=in>Ba người con trai trưởng thành của ngài <b>Đức Lự<\/b> (Đời thứ 12) chính là những người phát triển nhánh họ ở Đời thứ 13:<\/p><h3>2. Đức Đào (Đời 13.2 - Con thứ)<\/h3><ul><li><b>Danh tính:<\/b> Ngài có ý tên là Đều, tên chữ là <b>Đức Đào<\/b>, con trai thứ của ông Đức Lự.<\/li><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Huỳnh Thị Cái<\/b>, người làng Quảng Hậu.<\/li><li><b>Hậu duệ:<\/b><\/li><ul><li><b>Con trai:<\/b> <b>Đức Quáng<\/b> và <b>Đức Lèo<\/b> (đều trưởng thành).<\/li><li><b>Con gái:<\/b> <b>Thị Bán<\/b> (lấy chồng ở Nhứt Giáp) và <b>Thị Mua<\/b> (lấy chồng ở Phong Thử).<\/li><\/ul><li><b>Mộ phần &amp; Kỵ nhật:<\/b><\/li><ul><li>Ngài Đức Đào mất ngày <b>5 tháng 8 (âm lịch)<\/b>, an táng tại <b>xứ Ngoại Trạch<\/b>.<\/li><li>Bà Huỳnh Thị Cái mất ngày <b>1 tháng 1 (âm lịch)<\/b>, an táng tại <b>xứ Gò Quảng<\/b>.<\/li><\/ul><\/ul>"], ["13.3", "Đức Lý", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 13 (MƯỜI BA)<\/h3><p class=in>Ba người con trai trưởng thành của ngài <b>Đức Lự<\/b> (Đời thứ 12) chính là những người phát triển nhánh họ ở Đời thứ 13:<\/p><h3>3. Đức Lý (Đời 13.3 - Con út)<\/h3><ul><li><b>Danh tính:<\/b> Ngài có ý tên là Đức Thường, tên chữ là <b>Đức Lý<\/b>, con trai út của ông Đức Lự.<\/li><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Phạm Thị Thước<\/b>, người làng La Qua.<\/li><li><b>Hậu duệ:<\/b><\/li><ul><li><b>Con trai:<\/b> <b>Đức Thập<\/b>, <b>Đức Quân<\/b>, <b>Đức Bay<\/b>, <b>Đức Phường<\/b> (đều trưởng thành); cùng <b>Đức Gió<\/b> và <b>Đức Mưa<\/b> (mất sớm).<\/li><li><b>Con gái:<\/b> <b>Thị Đãi<\/b> (có chồng ở Phú Bài - Huế), <b>Thị Hồng<\/b> (có chồng ở Phú Cam - Huế).<\/li><\/ul><\/ul>"], ["14.1", "Đức Sắc", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 14 (MƯỜI BỐN)<\/h3><p class=in>Gồm các nhánh gia đình nối tiếp phả hệ từ các con trai Đời thứ 13:<\/p><h3>1. Đức Sắc (Đời 14.1 - Con ông Đức Thỏa)<\/h3><ul><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Phan Thị Lý<\/b> người trong làng.<\/li><li><b>Hậu duệ:<\/b> <b>Đức Thạnh<\/b>, <b>Đức Ngọc<\/b>, <b>Thị Liên<\/b>, <b>Thị Lan<\/b>, <b>Đức Thanh<\/b>, <b>Đức Tùng<\/b>, <b>Đức Vinh<\/b>, <b>Đức Hiền<\/b> (đều trưởng thành).<\/li><li><b>Ghi chú thêm:<\/b> Ngài Đức Sắc mất ngày <b>24 tháng 9 (âm lịch)<\/b>, an táng tại xứ Đồn Điền. Người con trai Đức Vinh mất sớm (ngày giỗ 2/6 âm lịch). Người con gái Thị Liên xuất gia tu tập và qua đời ngày 25/3 âm lịch tại Tịnh xá Ngọc Yên (thị xã Tuy Hòa).<\/li><\/ul>"], ["14.2", "Đức Đá", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 14 (MƯỜI BỐN)<\/h3><p class=in>Gồm các nhánh gia đình nối tiếp phả hệ từ các con trai Đời thứ 13:<\/p><h3>2. Đức Đá (Đời 14.2 - Con ông Đức Thỏa)<\/h3><ul><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Ngô Thị Mới<\/b> ở làng Tam Giáp.<\/li><li><b>Hậu duệ:<\/b> <b>Thị Cúc<\/b>, <b>Đức Mật<\/b> (mất sớm), <b>Thị Bích<\/b>, <b>Thị Sơn<\/b>, <b>Thị Thủy<\/b>, <b>Thị Mỹ<\/b>, <b>Thị Lệ<\/b>, <b>Đức Tuấn<\/b> (đều trưởng thành).<\/li><\/ul>"], ["14.3", "Đức Quáng", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 14 (MƯỜI BỐN)<\/h3><p class=in>Gồm các nhánh gia đình nối tiếp phả hệ từ các con trai Đời thứ 13:<\/p><h3>3. Đức Quáng (Đời 14.3 - Con ông Đức Đào)<\/h3><ul><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Dương Thị Thuần<\/b>, người làng Liệm Trì Nam (Hòa Vang).<\/li><li><b>Hậu duệ:<\/b> <b>Đức Hường<\/b>, <b>Thị Nhạn<\/b>, <b>Thị Hoa<\/b>, <b>Thị Hải<\/b>, <b>Đức Học<\/b>, <b>Thị Hà<\/b>, <b>Đức Sơn<\/b> (đều trưởng thành).<\/li><\/ul>"], ["14.4", "Đức Lèo", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 14 (MƯỜI BỐN)<\/h3><p class=in>Gồm các nhánh gia đình nối tiếp phả hệ từ các con trai Đời thứ 13:<\/p><h3>4. Đức Lèo (Đời 14.4 - Con ông Đức Đào)<\/h3><ul><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Phan Thị Tá<\/b> người trong làng.<\/li><li><b>Hậu duệ:<\/b> <b>Thị Phụng<\/b>, <b>Đức Hoàng<\/b>, <b>Đức Thành<\/b>, <b>Đức Phú (Giàu)<\/b>, <b>Đức Sang<\/b>, <b>Thị Vân<\/b>, <b>Thị Thủy<\/b>, <b>Thị Thảo<\/b> (đều trưởng thành).<\/li><\/ul>"], ["14.5", "Đức Thập", "<p class=in>Dưới đây là thông tin chi tiết về <b>Đời thứ 13<\/b> và <b>Đời thứ 14<\/b> trong phả hệ dòng họ:<\/p><h3>ĐỜI THỨ 14 (MƯỜI BỐN)<\/h3><p class=in>Gồm các nhánh gia đình nối tiếp phả hệ từ các con trai Đời thứ 13:<\/p><h3>5. Đức Thập (Đời 14.5 - Con ông Đức Lý)<\/h3><ul><li><b>Hôn nhân:<\/b> Ngài phối cùng bà <b>Phan Thị Hường<\/b> người trong làng.<\/li><li><b>Hậu duệ:<\/b> <b>Thị Yêm<\/b> (có chồng là Đoàn Ngọc Châu ở làng Hòa Thuận, Đà Nẵng), <b>Đức Niệm<\/b> (mất rất sớm), <b>Thị Mường<\/b>, <b>Thị Chơi<\/b> (trưởng thành), <b>Thị Tươi<\/b> (mất sớm), <b>Đức Rạng<\/b>, <b>Thị Yến<\/b>, <b>Đức Hùng<\/b> (đều trưởng thành).<\/li><\/ul>"], ["T", "Lời tựa 1955 · Ông Đức Bính Ký", "<p class=in>Lời tựa gia phả được viết vào <b>ngày 1 tháng 1 năm Ất Mùi (1955)<\/b> bởi <b>ông Đức Bính Ký<\/b> (cháu <b>Đời thứ 13<\/b> của dòng họ Nguyễn Đức). Lời tựa được trình bày dưới hình thức <b>văn xuôi<\/b> và bài thơ <b>Diễn ca lục bát<\/b>.<\/p><h3>1. Nguồn gốc bộ gia phả cũ<\/h3><ul><li>Tộc Nguyễn Đức vốn là một dòng họ lớn lâu đời ở <b>làng Hoa Phong<\/b>.<\/li><li>Đến niên hiệu <b>Cảnh Thịnh thứ 8 (thời nhà Tây Sơn)<\/b>, ông Tằng Tổ Bá (ông cố bác) của tác giả là <b>ông Ba Minh Hầu<\/b> (tên huý là <b>Ba Vĩnh<\/b>, còn gọi là <b>Hoa Minh<\/b>) đã nương theo cựu lục của gia tiên để biên soạn thành bộ gia phả lưu truyền hơn 100 năm.<\/li><\/ul><h3>2. Bối cảnh &amp; Lý do trùng tu năm 1955<\/h3><ul><li>Trải qua hơn một thế kỷ gặp nhiều biến động binh hỏa, <b>&quot;giấy tàn mực phai&quot;<\/b>, văn bản chữ Hán lâu ngày bị tam sao thất bản, mờ nhòe khó cứu xét.<\/li><li>Thời đại đã đổi mới sang chữ Quốc ngữ, con cháu dòng họ ngày một sinh sôi đông đúc. Nếu không dịch sang chữ Quốc ngữ thì e rằng hậu thế sau này sẽ không biết gốc tích tổ tiên ở đâu mà tìm.<\/li><\/ul><h3>3. Tác giả &amp; Thể thức biên soạn<\/h3><ul><li><b>Thân thế tác giả:<\/b> Ông <b>Đức Bính Ký<\/b> (cháu Đời thứ 13), khi viết lời tựa ông đã <b>80 tuổi<\/b> (lão thành) và từng thi đỗ <b>Ất khoa<\/b>.<\/li><li><b>Cách thức trình bày:<\/b> Ông kính tuân theo cựu lục cũ, biên soạn gia phả theo cấu trúc <b>&quot;trên chữ Hán, dưới chữ Quốc ngữ&quot;<\/b> để thế hệ sau dễ đọc, dễ hiểu.<\/li><li><b>Số lượng:<\/b> Bộ gia phả sau khi hoàn thành được chép làm <b>3 bản<\/b> lưu giữ tại Tổ đường.<\/li><\/ul><h3>4. Ý nguyện gửi gắm qua bài thơ Diễn ca<\/h3><p class=in>Trong bài thơ lục bát Diễn ca, tác giả bày tỏ tâm nguyện thiêng liêng đối với tổ tiên và con cháu:<\/p><p class=in><i>&quot;Trên liệt tổ linh hồn soi tỏ,<\/i> <i>Dưới hậu nhân ký đó làm gương.<\/i> <i>Chép làm ba bản tổ đường,<\/i> <i>Vẫn nhưng đời giữ đạo thường từ đây.&quot;<\/i><\/p>"]];
const E={"1": "<p class=in>The record for <b>Generation 1 – Đức Thỉ Tổ (the Founding Ancestor)<\/b> in the clan genealogy:<\/p><h3>1. Identity &amp; Origins<\/h3><ul><li><b>Name:<\/b> His family name was <b>Nguyễn<\/b> and his given name was <b>Trang<\/b>.<\/li><li><b>Ancestral home:<\/b> His forebears came from <b>Hoa Phong village, Lệ Dương district, Thanh Hóa circuit (lộ)<\/b>.<\/li><\/ul><h3>2. Settlement &amp; Place Names Through the Ages<\/h3><ul><li>When the Lê dynasty took the Citadel and made the land into the Quảng Nam circuit, Thăng Hoa garrison (vệ), he was appointed to administer an area of land.<\/li><li>After the administrative boundaries were redrawn, the area he administered belonged to <b>Quảng Nam circuit, Thăng Hoa garrison, Lệ Dương district, Hoa Phong commune, Nhị Giáp hamlet<\/b>.<\/li><li>The place name changed many times: under Lord Đoan (Đoan Quốc công) it became the Quảng Nam region, Thăng Hoa prefecture; under King Thái Đức it became Quảng Nam province, Điện Bàn prefecture, Diên Khánh district, Hạ Nông canton, Hoa Phong commune, Nhị Giáp hamlet; later Hoa Phong was renamed Khả Phong, and finally became <b>Phong Nhị commune<\/b>.<\/li><\/ul><h3>3. Marriage &amp; Descendants<\/h3><ul><li>He married <b>Lady Thị Đài<\/b>; they had many descendants and the family grew ever more prosperous.<\/li><li>Because the old genealogy book is torn and decayed, Lady Thị Đài's background, tomb, and death anniversary are no longer clearly recorded.<\/li><\/ul><h3>4. Tomb &amp; Death Anniversary (Kỵ nhật)<\/h3><ul><li><b>Burial place:<\/b> He died and was buried at <b>Dương Thần<\/b>, orientation <i>tọa khảm long tỵ hướng<\/i>, with an <b>inscribed stele and a 3-tier stele pavilion<\/b>.<\/li><li><b>Death anniversary:<\/b> observed every year on the <b>22nd day of the 2nd lunar month<\/b>.<\/li><\/ul><h3>5. Merit to the Clan<\/h3><ul><li>The genealogy honors him as the one who opened a lasting source, laying deep roots so that the branches of the Nguyễn clan could grow thick and prosperous in later generations.<\/li><\/ul>", "2": "<p class=in>Below are the details of <b>Generation 2 – Nhị thế tổ (2nd-generation ancestor)<\/b> as recorded in the clan genealogy:<\/p><h3>1. Origins &amp; Position<\/h3><ul><li><b>Parentage:<\/b> He was a son of Đức Thỉ Tổ (Nguyễn Trang).<\/li><li><b>Position:<\/b> He once held the post of <b>Sanh đề at the local prefecture (bản phủ)<\/b>.<\/li><\/ul><h3>2. Descendants &amp; the Beginning of the Two Branches<\/h3><ul><li>He had <b>2 sons<\/b>:<\/li><ul><li>Eldest son: <b>Đức Quang<\/b> – founding ancestor of <b>Phái Nhất<\/b> (the first branch).<\/li><li>Second son: <b>Đức Thuần<\/b> – founding ancestor of <b>Phái Nhì<\/b> (the second branch).<\/li><\/ul><li>As the descendants multiplied, the clan was formally divided into 2 main branches; both Phái Nhất and Phái Nhì compiled their own genealogical charts to hand down to later generations.<\/li><\/ul><h3>3. Tomb &amp; Background<\/h3><ul><li><b>Burial place:<\/b> He died and was buried at <b>Dương Thần<\/b>, orientation <i>tọa long tỵ hướng khảm<\/i>.<\/li><li><b>Tomb stele:<\/b> His tomb has an <b>inscribed stele and a 2-tier stele pavilion<\/b>.<\/li><li><b>His principal wife:<\/b> Her name, death date, death anniversary, and tomb are no longer clearly recorded because the old genealogy text has been torn and decayed over time.<\/li><\/ul>", "3.1": "<p class=in>Generation 3 (<b>Tam thế tổ<\/b>) in the genealogy is divided into 2 ancestors representing the two branches, <b>Phái Nhất<\/b> and <b>Phái Nhì<\/b>:<\/p><h3>1. Đức Quang (Eldest son – Founder of Phái Nhất)<\/h3><ul><li><b>Parentage:<\/b> He was the eldest son of the 2nd-generation ancestor.<\/li><li><b>Position:<\/b> Together with the ritual office (viện lễ), he held the post of <b>Sanh đề at the local prefecture<\/b>.<\/li><li><b>Descendants:<\/b> He had one son, <b>Đức Thọ<\/b>. His benevolent upkeep of the family allowed the Nguyễn clan to be handed down through the generations and grow ever more prosperous.<\/li><li><b>Tomb:<\/b> He died and was buried at <b>Dương Tháp<\/b>, orientation <i>tọa khảm hướng ly<\/i>.<\/li><li><b>Unknown details:<\/b> His death anniversary and his principal wife's background can no longer be traced because the old genealogical records are decayed and torn.<\/li><\/ul>", "3.2": "<p class=in>Generation 3 (<b>Tam thế tổ<\/b>) in the genealogy is divided into 2 ancestors representing the two branches, <b>Phái Nhất<\/b> and <b>Phái Nhì<\/b>:<\/p><h3>2. Đức Thuần (Second son – Founder of Phái Nhì)<\/h3><ul><li><b>Parentage:<\/b> He was the second son of the 2nd-generation ancestor and the younger brother of Đức Quang.<\/li><li><b>Position:<\/b> He held the post of <b>Ký phủ Thuần Khương tử<\/b>.<\/li><li><b>Descendants:<\/b> He began the <b>Phái Nhì<\/b> branch, and his descendants multiplied greatly in later generations.<\/li><li><b>Tomb:<\/b> He died and was buried at <b>Dương Thần<\/b>, orientation <i>tọa ly hướng khảm<\/i>.<\/li><li><b>Unknown details:<\/b> His death anniversary and the background of his wife's tomb are likewise no longer clearly recorded because the old text has deteriorated over time.<\/li><\/ul>", "4": "<p class=in>Below are the details of <b>Generation 4 – Tứ thế tổ (Đức Thọ)<\/b> of Phái Nhất in the clan genealogy:<\/p><h3>1. Identity &amp; Parentage<\/h3><ul><li><b>Given name:<\/b> His given name was <b>Đức Thọ<\/b>.<\/li><li><b>Parentage:<\/b> He was a son of the 3rd-generation ancestor <b>Đức Quang<\/b> (Phái Nhất).<\/li><\/ul><h3>2. Virtue &amp; Way of Life<\/h3><ul><li>He was a conscientious head of the family, wholeheartedly honoring his ancestors, kindly teaching his children and grandchildren, and keeping the household in good order.<\/li><li>He always lived in harmony with his neighbors and was deeply respected by people near and far.<\/li><\/ul><h3>3. Descendants<\/h3><p class=in>He had <b>2 sons<\/b>:<\/p><ul><li>Eldest son: <b>Đức Thắng<\/b> – the one who continued the main genealogical line of the Nguyễn clan.<\/li><li>Second son: <b>Đức Tuệ<\/b> – died young.<\/li><\/ul><h3>4. Tomb &amp; Background<\/h3><ul><li>His death anniversary and tomb, as well as the background of his principal wife's tomb, are damaged and torn in the old genealogical records and are no longer clearly recorded.<\/li><\/ul>", "5": "<p class=in>Below are the details of <b>Generation 5 – Ngũ thế tổ (Đức Thắng)<\/b> as recorded in the clan genealogy:<\/p><h3>1. Identity &amp; Parentage<\/h3><ul><li><b>Given name:<\/b> His given name was <b>Đức Thắng<\/b>.<\/li><li><b>Parentage:<\/b> He was a son of the 4th-generation ancestor <b>Đức Thọ<\/b>.<\/li><\/ul><h3>2. Virtue &amp; Way of Life<\/h3><ul><li>He upheld the family tradition, devoted himself to farming, taught his children with all his heart, and honored his ancestors.<\/li><li>His understanding of moral principles and his way of life were warmly praised by the whole clan and the village, building deep merit for descendants of later generations to remember.<\/li><\/ul><h3>3. Descendants<\/h3><p class=in>He had <b>2 sons<\/b>:<\/p><ul><li>Eldest son: <b>Đức Mạnh<\/b> (6th-generation ancestor, Generation 6.1).<\/li><li>Second son: <b>Đức Võ<\/b> (6th-generation ancestor, Generation 6.2).<\/li><\/ul><h3>4. Tomb &amp; Background<\/h3><ul><li>Information on his tomb and death anniversary, and on his principal wife's background, is <b>no longer clear<\/b> in the genealogical records.<\/li><\/ul>", "6.1": "<p class=in>Below are the details of <b>Generation 6 – Lục thế tổ (Đức Mạnh)<\/b> as recorded in the clan genealogy:<\/p><h3>1. Identity &amp; Parentage<\/h3><ul><li><b>Given name:<\/b> His given name was <b>Đức Mạnh<\/b>.<\/li><li><b>Parentage:<\/b> He was the eldest son of the 5th-generation ancestor <b>Đức Thắng<\/b>.<\/li><\/ul><h3>2. Marriage &amp; Descendants<\/h3><ul><li><b>Principal wife:<\/b> He married <b>Lady Thị Bi<\/b>, daughter of Mr. Nguyễn Vĩnh Tân of the same village.<\/li><li><b>Descendants:<\/b> They had <b>1 son<\/b> and <b>3 daughters<\/b>:<\/li><ul><li>Son: <b>Đức Cường<\/b> (who carried on the line of Generation 7).<\/li><li>Eldest daughter: <b>Thị Hiện<\/b> (married).<\/li><li>Second daughter: <b>Thị Hổ<\/b> (married to Mr. Huỳnh Công Kiện of Giáp Ba).<\/li><li>Youngest daughter: <b>Thị Chi<\/b> (married to Mr. Huấn đạo kính luận Nam Trịnh Công Thị – a Huấn đạo, i.e. district education official – of the same village).<\/li><\/ul><\/ul><h3>3. Character &amp; Way of Life<\/h3><ul><li>He was <b>gentle and honest<\/b>, always preserved the proper conduct and customs of the family, and was warmly admired by the neighbors around him.<\/li><\/ul><h3>4. Lifespan, Tomb &amp; Death Anniversary (Kỵ nhật)<\/h3><ul><li><b>Concerning Đức Mạnh:<\/b><\/li><ul><li>He lived to the age of <b>63<\/b>.<\/li><li>He died on the <b>11th day of the 8th lunar month<\/b>.<\/li><li>Buried at <b>Dương Thần<\/b> (plot 3, section 2), orientation <i>tọa tốn hướng cấn<\/i>.<\/li><\/ul><li><b>Concerning Lady Thị Bi:<\/b><\/li><ul><li>She died on the <b>6th day of the 11th lunar month<\/b>.<\/li><li>Buried at <b>Đồn Điền<\/b>, orientation <i>tọa khôn hướng cấn<\/i>.<\/li><\/ul><\/ul>"};
