<script>
var DATA={"vi": {"title": "CẢM NHẬN", "sub": "Gia phả Online Tộc Nguyễn Đức – Phái 1, Chi 1, Hệ 3", "lead": "Nhìn lại giá trị đã xây dựng – Nhận diện những điều cần hoàn thiện – Cùng nhau gìn giữ di sản tổ tiên.", "greet": "", "home": "🏠 Về trang chủ", "open": "Mở tất cả", "close": "Thu gọn tất cả", "note": "Bấm vào từng mục để mở hoặc thu gọn.", "sec": [["1. Phạm vi và cách đọc phần cảm nhận", "<p>Một số người đã xem website và nhận xét theo hai góc nhìn: <b>người nghiên cứu lịch sử dòng họ<\/b> và <b>người thiết kế sản phẩm gia phả số<\/b>. Qua nội dung trang công khai, họ nhận thấy đây không đơn thuần là một cây phả hệ trực tuyến, mà đang hướng tới việc lưu giữ lịch sử, nguồn gốc, các thế hệ và những tư liệu truyền lại của Tộc Nguyễn Đức.<\/p>\n<ul><li>Các nhận xét dựa trên nội dung và chức năng được website công khai giới thiệu.<\/li><li>Đây là <b>đánh giá định tính<\/b>, không phải điểm kiểm định kỹ thuật và không xác nhận tính chính xác lịch sử của gia phả.<\/li><li>Phần “Hiện trạng” và “Tự nhìn lại” do người thực hiện đối chiếu với website hiện nay; không chấm điểm, chỉ ghi rõ cái đã có và chưa có.<\/li><\/ul>"], ["2. Nội dung lịch sử và gia phả", "<h4>Điểm mạnh nổi bật<\/h4>\n<ol type=\"a\"><li><b>Có nguồn gốc tư liệu được giới thiệu.<\/b> Website nêu: bản gia phả gốc bằng chữ Hán từ thời Tây Sơn; ngày 1/1 năm Ất Mùi (1955), Đức Bính Ký (đời 13) tục biên và chuyển sang Quốc văn; Thủy tổ là Nguyễn Trang; quê gốc ở làng Hoa Phong, huyện Lệ Dương, lộ Thanh Hóa, sau vào Quảng Nam.<\/li>\n<li><b>Có cấu trúc thế hệ tương đối rõ.<\/b> Các đời được thể hiện từ Thủy tổ đến Đời 14, gồm các nhánh Đức Quang, Đức Thuần, Đức Mạnh, Đức Võ và các hậu duệ.<\/li>\n<li><b>Có giá trị văn hóa, giáo dục truyền thống.<\/b> Gia phả không chỉ ghi tên người mà còn ghi quan hệ huyết thống, phối ngẫu, con cháu, quê quán, nơi an táng, chức tước và một số sự kiện lịch sử. Đây được xem là điểm đáng quý nhất.<\/li><\/ol>"], ["3. Hệ thống chức năng", "<p>Bản nhận xét ban đầu nêu 11 nhóm chức năng chính. Hiện website có 12 mục menu (thêm mục này); bảng dưới ghép nhận xét với hiện trạng.<\/p><p class=\"legend\">Chú thích: ✅ Đã có · ⚠️ Có một phần · ⬜ Chưa có. Cột “Hiện trạng” là phần người thực hiện đối chiếu với website hiện nay.<\/p><div class=\"tw\"><table><thead><tr><th>Chức năng<\/th><th>Nhận xét<\/th><th>Hiện trạng<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Chức năng\">🌳 Cây gia phả<\/td><td data-l=\"Nhận xét\">Chức năng cốt lõi<\/td><td data-l=\"Hiện trạng\">✅ Các ô từ Thủy tổ đến Đời 14, bấm để xem thông tin; nút +/- thu gọn, mở nhánh; có Lời Tự 1955 và Diễn ca<\/td><\/tr><tr><td data-l=\"Chức năng\">📖 Tóm tắt<\/td><td data-l=\"Nhận xét\">Giúp người xem nắm lịch sử<\/td><td data-l=\"Hiện trạng\">✅ Sách lật (heyzine) mở ngay trong trang<\/td><\/tr><tr><td data-l=\"Chức năng\">🎬 Video<\/td><td data-l=\"Nhận xét\">Tăng khả năng truyền tải<\/td><td data-l=\"Hiện trạng\">✅ Video YouTube phát ngay trong trang<\/td><\/tr><tr><td data-l=\"Chức năng\">🕯️ Ngày kỵ<\/td><td data-l=\"Nhận xét\">Hữu ích cho việc tưởng nhớ<\/td><td data-l=\"Hiện trạng\">⚠️ Bảng ngày kỵ trọng đại Đời 1–14 (các vị chính), có bản English; chưa đủ mọi vị<\/td><\/tr><tr><td data-l=\"Chức năng\">📜 Chi tiết<\/td><td data-l=\"Nhận xét\">Phục vụ tra cứu<\/td><td data-l=\"Hiện trạng\">✅ Nguyên văn 25 mục (Đời 1 đến 14.5 và Lời tựa), có bản dịch English<\/td><\/tr><tr><td data-l=\"Chức năng\">🖼️ Hình ảnh<\/td><td data-l=\"Nhận xét\">Lưu giữ tư liệu<\/td><td data-l=\"Hiện trạng\">⬜ Đang cập nhật, chưa có ảnh<\/td><\/tr><tr><td data-l=\"Chức năng\">📑 Trình bày (trước đây là Phân tích)<\/td><td data-l=\"Nhận xét\">Có tiềm năng khai thác dữ liệu<\/td><td data-l=\"Hiện trạng\">⚠️ Bản trình bày 11 trang (PDF Việt, English); chưa phải công cụ phân tích dữ liệu<\/td><\/tr><tr><td data-l=\"Chức năng\">📊 Tổng hợp<\/td><td data-l=\"Nhận xét\">Hỗ trợ thống kê<\/td><td data-l=\"Hiện trạng\">⚠️ Bảng 24 vị (thứ tự, họ tên, đời, vợ, con, ghi chú); chưa có số liệu thống kê tổng hợp<\/td><\/tr><tr><td data-l=\"Chức năng\">🔍 Tìm kiếm<\/td><td data-l=\"Nhận xét\">Rất cần thiết<\/td><td data-l=\"Hiện trạng\">✅ Tìm không dấu trong cây, Tổng hợp, Chi tiết, PDF; kết quả có link tới vị trí<\/td><\/tr><tr><td data-l=\"Chức năng\">🔐 Quản Trị<\/td><td data-l=\"Nhận xét\">Phục vụ cập nhật dữ liệu<\/td><td data-l=\"Hiện trạng\">⚠️ Hiện chỉ xem thống kê lượt truy cập (ngày, tháng, năm); chưa sửa được dữ liệu trên web, dữ liệu cập nhật bằng cách thay tệp trên GitHub<\/td><\/tr><tr><td data-l=\"Chức năng\">❓ Hướng dẫn<\/td><td data-l=\"Nhận xét\">Hỗ trợ người sử dụng<\/td><td data-l=\"Hiện trạng\">✅ Hướng dẫn xem trên điện thoại, mã QR, số hỗ trợ và hướng dẫn từng mục<\/td><\/tr><tr><td data-l=\"Chức năng\">📋 Cảm nhận<\/td><td data-l=\"Nhận xét\">(mục thêm sau)<\/td><td data-l=\"Hiện trạng\">✅ Trang bạn đang đọc<\/td><\/tr><\/tbody><\/table><\/div>"], ["4. Những điểm cần cải thiện", "<p>Sáu nội dung được đề xuất ưu tiên, kèm hiện trạng:<\/p><p class=\"legend\">Chú thích: ✅ Đã có · ⚠️ Có một phần · ⬜ Chưa có. Cột “Hiện trạng” là phần người thực hiện đối chiếu với website hiện nay.<\/p>\n<h4>1. Bổ sung thông tin kiểm chứng nguồn tư liệu<\/h4><ul><li>⚠️ Giới thiệu người biên soạn, người cung cấp tư liệu: Lời tựa nêu ông Ba Minh Hầu (biên soạn thời Cảnh Thịnh) và Đức Bính Ký (tục biên 1955); chưa có giới thiệu riêng từng người.<\/li><li>⬜ Ảnh chụp bản gia phả chữ Hán gốc (nếu còn lưu giữ).<\/li><li>⬜ Ảnh bản tục biên năm 1955.<\/li><li>⬜ Phân biệt thông tin trích từ gia phả gốc với thông tin con cháu bổ sung sau này.<\/li><\/ul>\n<h4>2. Hoàn thiện cây gia phả trực quan<\/h4><ul><li>⬜ Phân biệt các đời bằng màu sắc (hiện các ô cùng màu, số đời ghi ở tiêu đề ô).<\/li><li>⚠️ Phân biệt chi, phái: có ghi Phái 1, Phái 2 ở một số ô, chưa phân màu.<\/li><li>✅ Bấm vào một người để xem thông tin.<\/li><li>✅ Nút mở rộng và thu gọn các nhánh.<\/li><li>⬜ Nút trở về Thủy tổ từ bất kỳ vị trí.<\/li><\/ul>\n<h4>3. Hoàn thiện hồ sơ từng thành viên<\/h4><ul><li>✅ Họ tên; đời thứ mấy, thuộc chi phái nào; vợ và con (trong Chi tiết và bảng Tổng hợp).<\/li><li>⚠️ Năm sinh, năm mất: gia phả chủ yếu ghi ngày kỵ và tuổi thọ; thông tin chưa kiểm chứng thì chưa ghi.<\/li><li>⚠️ Tiểu sử và công trạng: có cho một số vị (ví dụ Đức Võ), nhiều vị chưa có tư liệu.<\/li><li>⬜ Ảnh chân dung, ảnh tư liệu.<\/li><\/ul>\n<h4>4. Nâng cấp chức năng tìm kiếm<\/h4><ul><li>✅ Tìm theo tên (có dấu hoặc không dấu), kể cả tên vợ, con, địa danh, ngày kỵ.<\/li><li>⬜ Bộ lọc riêng theo đời, chi phái, tên cha mẹ, tên vợ/chồng (hiện gõ từ khóa, ví dụ “Đời 8”).<\/li><\/ul>\n<h4>5. Tăng giá trị lưu giữ hình ảnh và tư liệu<\/h4><ul><li>⚠️ Gia phả Quốc văn: nội dung đã chép lại và dịch (Chi tiết), chưa có ảnh chụp bản gốc.<\/li><li>⬜ Gia phả chữ Hán; ảnh chân dung các thế hệ; ảnh nhà thờ tộc, từ đường, mộ tổ; văn bản sắc phong, bằng cấp, tài liệu lịch sử. Menu Hình ảnh là nơi để bổ sung.<\/li><\/ul>\n<h4>6. Bảo vệ dữ liệu và quyền riêng tư<\/h4><ul><li>✅ Chỉ người quản lý kho GitHub mới thay được dữ liệu; người xem không sửa được.<\/li><li>✅ GitHub lưu lịch sử các lần thay đổi tệp, có thể đối chiếu khi phát hiện sai sót.<\/li><li>⚠️ Sao lưu định kỳ: nên lưu thêm một bản ở máy hoặc ổ đĩa riêng.<\/li><li>⚠️ Hạn chế công khai thông tin người còn sống: website đang công khai tên con cháu đến Đời 14 và con của họ; nên cân nhắc ẩn hoặc rút gọn.<\/li><\/ul>\n<p><b>Lưu ý:<\/b> ô đăng nhập Quản Trị chỉ để xem thống kê và việc kiểm tra mật khẩu diễn ra ngay trong trình duyệt, nên <b>không phải bảo mật thật<\/b>; không dùng để bảo vệ thông tin nhạy cảm.<\/p>"], ["5. Tự nhìn lại của người thực hiện", "<p>Sản phẩm là cách làm do cá nhân tự tìm hiểu và phát triển, không phải sản phẩm thuê đơn vị chuyên nghiệp thiết kế; không khẳng định là cách tốt nhất hay duy nhất. Điều tâm đắc nhất không phải số chức năng, mà là thông tin về tổ tiên, ông bà, cha mẹ và con cháu có thêm một cách để lưu giữ và tiếp cận, dù ở gần hay xa.<\/p>\n<ul><li><b>Phạm vi:<\/b> theo tài liệu đã đối chiếu, nhánh gia đình thuộc Phái 1 – Chi 1 – Hệ 3, nên sản phẩm tập trung trước trong phạm vi Hệ 3.<\/li><li><b>Chưa xác định được nhánh:<\/b> còn một số gia đình chưa rõ thuộc nhánh tổ tiên nào (có thể thuộc hệ khác); do chưa đủ tư liệu xác thực nên chưa kết luận.<\/li><li><b>Nguyên tắc:<\/b> thông tin chưa chắc chắn thì không ghi thành sự thật; mối quan hệ chưa rõ cần được xác minh từ người lớn tuổi và tài liệu đáng tin cậy.<\/li><li><b>Tư liệu gốc:<\/b> một số chi tiết trong các tư liệu gốc viết chưa thống nhất (cách viết một số tên, địa danh). Website đã chọn một cách viết chung nhưng vẫn cần đối chiếu thêm.<\/li><li><b>Phiên bản đầu tiên:<\/b> là kết quả tìm hiểu, suy nghĩ chủ quan của cá nhân nên khó tránh thiếu sót.<\/li><\/ul>"], ["6. Đánh giá tổng thể và định hướng", "<p><b>Có giá trị phát triển thành gia phả số lâu dài.<\/b> Sản phẩm có nền tảng nội dung lịch sử, cấu trúc phả hệ và định hướng chức năng tương đối phong phú. Đây là đánh giá định tính, không phải kiểm định kỹ thuật hay xác nhận tính chính xác lịch sử.<\/p>\n<h4>Ba giá trị cốt lõi<\/h4><ul><li><b>Lưu giữ:<\/b> số hóa những tư liệu gia phả quý báu của tổ tiên.<\/li><li><b>Kết nối:<\/b> giúp con cháu ở nhiều nơi tìm hiểu nguồn cội và quan hệ huyết thống.<\/li><li><b>Truyền đời:<\/b> giúp thế hệ trẻ hiểu lịch sử dòng họ, biết ơn tổ tiên và tiếp tục bổ sung tư liệu cho các thế hệ sau.<\/li><\/ul>\n<p>Điều đáng đầu tư nhất không phải là thêm nhiều hiệu ứng cho website, mà là xây dựng một kho tư liệu gia phả có nguồn gốc rõ ràng, dữ liệu đáng tin cậy, dễ tra cứu và có thể bàn giao cho các thế hệ kế tiếp.<\/p>\n<h4>Đề xuất để cùng hoàn thiện<\/h4>\n<ol><li><b>Trước mắt – cùng rà soát và bổ sung thông tin:<\/b> xem kỹ tên tuổi, quan hệ cha mẹ, vợ chồng, con cái, các thế hệ; có sai sót hoặc thông tin mới xin góp ý để bổ sung, điều chỉnh hoặc loại bỏ. Đặc biệt mong tư liệu, hình ảnh, thông tin từ các Bác, các Chú và người lớn tuổi.<\/li>\n<li><b>Trước mắt – xem xét chọn tên miền riêng cho Hệ 3:<\/b> hiện website dùng địa chỉ miễn phí trên GitHub Pages; nên cân nhắc tên miền dễ nhớ, thể hiện tên dòng họ hoặc hệ, và mong Trưởng hệ 3 cho ý kiến để thống nhất.<\/li>\n<li><b>Lâu dài – đăng ký, duy trì tên miền và thuê hosting<\/b> (nếu dữ liệu lớn dần): cần thống nhất người quản lý, kinh phí đăng ký và chi phí duy trì hằng năm. Trước mắt chưa nhất thiết đầu tư; nên tận dụng giải pháp miễn phí, kiểm nghiệm thực tế rồi mới quyết định nâng cấp.<\/li><\/ol>"], ["7. Lời kết và lời mời góp ý", "<p>Thưa các Bác, các Chú, các Anh, Chị và toàn thể con cháu! Khi bắt tay thực hiện, người thực hiện chỉ nghĩ đơn giản là làm một cây gia phả để mọi người xem cho thuận tiện. Nhưng càng tìm hiểu càng nhận ra ý nghĩa lớn hơn: đằng sau mỗi cái tên là một cuộc đời, một gia đình; đằng sau mỗi nhánh cây là những thế hệ đã sinh sống, lao động, vun đắp và tiếp nối dòng họ. Có những thông tin nếu hôm nay không ghi lại thì mai sau có thể không còn ai nhớ chính xác.<\/p>\n<p>Đây mới là phiên bản đầu tiên. Rất mong mọi người dành thời gian xem xét, đánh giá, góp ý thẳng thắn. Nếu ai biết mô hình gia phả nào có công nghệ hay hơn, giao diện đẹp hơn, cách quản lý khoa học hơn, xin chụp ảnh, gửi đường dẫn hoặc nhắn để tham khảo. Sản phẩm được thực hiện với tinh thần chia sẻ, phục vụ dòng họ, hoàn toàn miễn phí; không đặt nặng thành tích cá nhân, không nhằm mục đích kinh doanh.<\/p>\n<blockquote>Cây có cội mới nở cành xanh lá,<br>Người có tổ tiên mới có chúng ta hôm nay.<br>Giữ gìn gia phả không chỉ là ghi lại tên người đã khuất,<br>Mà còn là gìn giữ ký ức, tình thân và nguồn cội cho mai sau.<\/blockquote>\n<p class=\"sign\">Người thực hiện: NĐH – Đời 15<br>Gia phả Online Tộc Nguyễn Đức – Phái 1, Chi 1, Hệ 3<\/p>"]], "foot": "<div class=\"box\"><b>Đường dẫn gia phả online:<\/b> <a href=\"https://xomdongmieu.github.io/Cay-Gia-Pha\">https://xomdongmieu.github.io/Cay-Gia-Pha<\/a><br><b>Góp ý, hỗ trợ:<\/b> <a href=\"tel:0905003433\">0905003433<\/a><p>Xin gửi lời cảm ơn sâu sắc đến anh NĐT, đời 15 (Trưởng hệ 3), đã nhiệt tình ủng hộ và không ngừng động viên tinh thần kịp thời tác giả từ khi bắt đầu triển khai trực tuyến Phả hệ dòng họ Nguyễn Đức cho đến tận lúc chăm sóc nâng niu phát triển hoàn thiện và hoàn thành sản phẩm này.<\/p><p><b>Trân trọng cảm ơn các Bác, các Chú, các Anh, Chị và toàn thể con cháu!<\/b><\/p><\/div>"}, "en": {"title": "IMPRESSIONS", "sub": "Nguyễn Đức Clan Online Genealogy – Branch 1, Sub-branch 1, Line 3 (Phái 1 – Chi 1 – Hệ 3)", "lead": "Looking back at the value built – Identifying what needs improving – Preserving our ancestors' legacy together.", "greet": "", "home": "🏠 Back to home", "open": "Expand all", "close": "Collapse all", "note": "Tap a section to expand or collapse it.", "sec": [["1. Scope and how to read these impressions", "<p>Some people viewed the website and commented from two perspectives: that of a <b>researcher of clan history<\/b> and that of a <b>designer of digital genealogy products<\/b>. From the publicly visible content, they found it to be more than an online family tree: it aims to preserve the history, origins, generations and inherited documents of the Nguyễn Đức clan.<\/p>\n<ul><li>The comments are based on the content and functions the website publicly presents.<\/li><li>This is a <b>qualitative evaluation<\/b>, not a technical test score, and it does not confirm the historical accuracy of the genealogy.<\/li><li>The “Current status” and “Looking back” parts were checked by the author against the website as it is today; there are no scores, only a clear note of what exists and what does not.<\/li><\/ul>"], ["2. Historical and genealogical content", "<h4>Notable strengths<\/h4>\n<ol type=\"a\"><li><b>Its source documents are introduced.<\/b> The website states: the original genealogy in Hán script dates from the Tây Sơn era; on 1/1 of the Ất Mùi year (1955), Đức Bính Ký (Generation 13) continued the record and rendered it in Quốc văn; the Founding Ancestor is Nguyễn Trang; the ancestral home is Hoa Phong village, Lệ Dương district, Thanh Hóa circuit, later Quảng Nam.<\/li>\n<li><b>The generational structure is fairly clear.<\/b> Generations are shown from the Founding Ancestor to Generation 14, including the branches of Đức Quang, Đức Thuần, Đức Mạnh, Đức Võ and their descendants.<\/li>\n<li><b>It carries traditional cultural and educational value.<\/b> The genealogy records not only names but also blood relations, spouses, descendants, native places, burial places, titles and some historical events. This is regarded as its most precious feature.<\/li><\/ol>"], ["3. System of functions", "<p>The initial review listed 11 main function groups. The website now has 12 menu items (this page was added); the table below pairs the comments with the current status.<\/p><p class=\"legend\">Key: ✅ Done · ⚠️ Partly done · ⬜ Not yet. The “Current status” column is the author's check against the website as it is today.<\/p><div class=\"tw\"><table><thead><tr><th>Function<\/th><th>Comment<\/th><th>Current status<\/th><\/tr><\/thead><tbody><tr><td data-l=\"Function\">🌳 Family Tree<\/td><td data-l=\"Comment\">Core function<\/td><td data-l=\"Current status\">✅ Boxes from the Founding Ancestor to Generation 14, tap to see details; +/- buttons to collapse and expand branches; includes the 1955 Preface and verse retelling<\/td><\/tr><tr><td data-l=\"Function\">📖 Summary<\/td><td data-l=\"Comment\">Helps viewers grasp the history<\/td><td data-l=\"Current status\">✅ Flipbook (heyzine) opens inside the page<\/td><\/tr><tr><td data-l=\"Function\">🎬 Video<\/td><td data-l=\"Comment\">Improves communication<\/td><td data-l=\"Current status\">✅ YouTube video plays inside the page<\/td><\/tr><tr><td data-l=\"Function\">🕯️ Anniversaries<\/td><td data-l=\"Comment\">Useful for remembrance<\/td><td data-l=\"Current status\">⚠️ Table of major death anniversaries, Generations 1–14 (the main figures), with an English version; not every person is included<\/td><\/tr><tr><td data-l=\"Function\">📜 Details<\/td><td data-l=\"Comment\">Supports lookup<\/td><td data-l=\"Current status\">✅ Original text of 25 entries (Generation 1 to 14.5 and the Preface), with an English translation<\/td><\/tr><tr><td data-l=\"Function\">🖼️ Gallery<\/td><td data-l=\"Comment\">Preserves documents and pictures<\/td><td data-l=\"Current status\">⬜ Being updated, no pictures yet<\/td><\/tr><tr><td data-l=\"Function\">📑 Presentation (formerly Analysis)<\/td><td data-l=\"Comment\">Potential for exploiting data<\/td><td data-l=\"Current status\">⚠️ An 11-page presentation (PDF in Vietnamese and English); not yet a data-analysis tool<\/td><\/tr><tr><td data-l=\"Function\">📊 Overview<\/td><td data-l=\"Comment\">Supports statistics<\/td><td data-l=\"Current status\">⚠️ Table of 24 persons (no., name, generation, spouse, children, notes); no aggregate statistics yet<\/td><\/tr><tr><td data-l=\"Function\">🔍 Search<\/td><td data-l=\"Comment\">Very necessary<\/td><td data-l=\"Current status\">✅ Accent-insensitive search across the tree, Overview, Details and PDFs; results link to the exact place<\/td><\/tr><tr><td data-l=\"Function\">🔐 Admin<\/td><td data-l=\"Comment\">Serves data updating<\/td><td data-l=\"Current status\">⚠️ Currently only shows visit statistics (day, month, year); data cannot be edited on the web — it is updated by replacing files on GitHub<\/td><\/tr><tr><td data-l=\"Function\">❓ Guide<\/td><td data-l=\"Comment\">Supports users<\/td><td data-l=\"Current status\">✅ Phone-viewing guide, QR code, support number and a guide to every menu item<\/td><\/tr><tr><td data-l=\"Function\">📋 Impressions<\/td><td data-l=\"Comment\">(added later)<\/td><td data-l=\"Current status\">✅ The page you are reading<\/td><\/tr><\/tbody><\/table><\/div>"], ["4. Points that need improving", "<p>Six items are proposed as priorities, with their current status:<\/p><p class=\"legend\">Key: ✅ Done · ⚠️ Partly done · ⬜ Not yet. The “Current status” column is the author's check against the website as it is today.<\/p>\n<h4>1. Add information to verify the source documents<\/h4><ul><li>⚠️ Introduce the compilers and providers of the documents: the Preface names Mr. Ba Minh Hầu (compiler in the Cảnh Thịnh era) and Đức Bính Ký (continuation, 1955); each person is not yet introduced separately.<\/li><li>⬜ A photo of the original Hán-script genealogy (if it survives).<\/li><li>⬜ A photo of the 1955 continuation.<\/li><li>⬜ Distinguish information taken from the original genealogy from information added later by descendants.<\/li><\/ul>\n<h4>2. Improve the visual family tree<\/h4><ul><li>⬜ Distinguish generations by color (the boxes currently share one color; the generation is written in the box title).<\/li><li>⚠️ Distinguish sub-branches and branches: Phái 1 and Phái 2 are noted on some boxes, but not color-coded.<\/li><li>✅ Tap a person to see their information.<\/li><li>✅ Buttons to expand and collapse branches.<\/li><li>⬜ A button to return to the Founding Ancestor from any position.<\/li><\/ul>\n<h4>3. Complete each member's profile<\/h4><ul><li>✅ Name; generation and branch; spouse and children (in Details and the Overview table).<\/li><li>⚠️ Birth and death years: the genealogy mainly records death anniversaries and lifespans; unverified information is not written.<\/li><li>⚠️ Biography and merits: available for some persons (for example Đức Võ); many have no documents.<\/li><li>⬜ Portraits and document photos.<\/li><\/ul>\n<h4>4. Upgrade the search function<\/h4><ul><li>✅ Search by name (with or without accents), including spouse names, children, place names and death anniversaries.<\/li><li>⬜ Separate filters by generation, branch, parents' names, spouse names (currently you type a keyword, e.g. “Gen. 8”).<\/li><\/ul>\n<h4>5. Increase the value of preserved pictures and documents<\/h4><ul><li>⚠️ Quốc văn genealogy: the content has been transcribed and translated (Details), but there is no photo of the original.<\/li><li>⬜ The Hán-script genealogy; portraits of the generations; photos of the clan temple, ancestral hall and ancestors' tombs; royal decrees, diplomas and historical documents. The Gallery menu is the place to add them.<\/li><\/ul>\n<h4>6. Protect data and privacy<\/h4><ul><li>✅ Only the manager of the GitHub repository can change the data; viewers cannot edit it.<\/li><li>✅ GitHub keeps the history of file changes, which can be compared when mistakes are found.<\/li><li>⚠️ Regular backups: it is advisable to keep one more copy on a separate computer or drive.<\/li><li>⚠️ Limit public information about living persons: the website publicly lists descendants up to Generation 14 and their children; hiding or shortening it should be considered.<\/li><\/ul>\n<p><b>Note:<\/b> the Admin login only shows statistics and the password is checked inside the browser, so it is <b>not real security<\/b>; do not use it to protect sensitive information.<\/p>"], ["5. The author's look back", "<p>The product is a self-taught approach developed by one person, not something designed by a hired professional firm; it is not claimed to be the best or only way. What matters most to the author is not the number of functions but that information about ancestors, grandparents, parents and descendants now has one more way to be kept and reached, near or far.<\/p>\n<ul><li><b>Scope:<\/b> according to the documents cross-checked, this family belongs to Branch 1 – Sub-branch 1 – Line 3, so the product first focuses on Line 3.<\/li><li><b>Branch not yet identified:<\/b> some families cannot yet be placed under an ancestral branch (they may belong to other lines); without reliable documents, no conclusion has been drawn.<\/li><li><b>Principle:<\/b> information that is not certain is not written as fact; unclear relationships must be verified with elders and trustworthy documents.<\/li><li><b>Source documents:<\/b> some details in the original sources are written inconsistently (the spelling of some names and places). The website has chosen one common spelling, but it still needs checking.<\/li><li><b>First version:<\/b> it is the result of one person's subjective study and thinking, so shortcomings are hard to avoid.<\/li><\/ul>"], ["6. Overall assessment and direction", "<p><b>It has the potential to grow into a lasting digital genealogy.<\/b> The product has a foundation of historical content, a genealogical structure and a fairly rich set of planned functions. This is a qualitative assessment, not a technical test or a confirmation of historical accuracy.<\/p>\n<h4>Three core values<\/h4><ul><li><b>Preserve:<\/b> digitize the precious genealogical documents of the ancestors.<\/li><li><b>Connect:<\/b> help descendants in many places learn about their roots and blood relations.<\/li><li><b>Pass on:<\/b> help the young generation understand the clan's history, be grateful to ancestors and keep adding documents for later generations.<\/li><\/ul>\n<p>What is most worth investing in is not more visual effects, but building a genealogy archive with clear sources, reliable data, easy lookup, and one that can be handed over to the next generations.<\/p>\n<h4>Proposals for improving it together<\/h4>\n<ol><li><b>Near term – review and add information together:<\/b> check names, parents, spouses, children and generations carefully; if you find a mistake or have new information, please say so so it can be added, corrected or removed. Documents, pictures and information from elders are especially welcome.<\/li>\n<li><b>Near term – consider a domain name for Line 3:<\/b> the website currently uses a free address on GitHub Pages; an easy-to-remember domain reflecting the clan or line name is worth considering, and the head of Line 3 is invited to give an opinion so that it can be agreed on.<\/li>\n<li><b>Long term – register and maintain a domain name and rent hosting<\/b> (if the data keeps growing): the family would need to agree on who manages it, the registration cost and the yearly renewal cost. There is no need to invest right away; use the free solutions first, test them in practice, then decide on upgrading.<\/li><\/ol>"], ["7. Closing words and an invitation for feedback", "<p>Dear uncles, aunts, brothers, sisters and all descendants! When starting, the author only thought of making a family tree for everyone's convenience. But the more he learned, the more he saw its greater meaning: behind every name is a life and a family; behind every branch are generations who lived, worked, nurtured and continued the clan. Some information, if not recorded today, may later have no one left to remember it accurately.<\/p>\n<p>This is only the first version. You are warmly invited to take time to review, evaluate and give frank feedback. If you know of a genealogy model with better technology, a more beautiful interface or more scientific management, please send a photo, a link or a message. The product is made in a spirit of sharing and service to the clan, completely free; it is not about personal achievement and not for business.<\/p>\n<blockquote>A tree must have roots to put forth green branches and leaves;<br>we exist today because we have ancestors.<br>Preserving the genealogy is not only recording the names of those who have passed,<br>but also keeping memory, kinship and roots alive for the future.<\/blockquote>\n<p class=\"sign\">Author: NĐH – Generation 15<br>Nguyễn Đức Clan Online Genealogy – Branch 1, Sub-branch 1, Line 3<\/p>"]], "foot": "<div class=\"box\"><b>Online genealogy address:<\/b> <a href=\"https://xomdongmieu.github.io/Cay-Gia-Pha\">https://xomdongmieu.github.io/Cay-Gia-Pha<\/a><br><b>Feedback and support:<\/b> <a href=\"tel:0905003433\">0905003433<\/a><p>Sincere thanks to Mr. NĐT, Generation 15 (head of Line 3), for his enthusiastic support and constant, timely moral encouragement of the author, from the start of putting the Nguyễn Đức clan genealogy online right up to the time he carefully nurtured, developed, refined and completed this product.<\/p><p><b>Thank you, dear uncles, aunts, brothers, sisters and all descendants!<\/b><\/p><\/div>"}};

  var hr='index.html'+(EN?'?lang=en':''); $('h1').href=hr; $('h2').href=hr; $('h1').textContent=d.home; $('h2').textContent=d.home; $('oa').textContent=d.open; $('ca').textContent=d.close;
  var h=location.hash.replace('#',''), s='';
